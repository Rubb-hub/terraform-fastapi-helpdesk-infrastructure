<svg viewBox="0 0 1072 731" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="1072" height="731" fill="#0d1117"/>

  <!-- Internet gateway box -->
  <rect x="187" y="33" width="215" height="65" rx="12" fill="#f0ece0" stroke="#f0ece0"/>
  <text x="294" y="72" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="500">Internet gateway</text>

  <!-- Line from IGW to VPC -->
  <line x1="294" y1="98" x2="294" y2="156" stroke="#8a8a8a" stroke-width="2"/>

  <!-- VPC container -->
  <rect x="95" y="156" width="892" height="519" rx="24" fill="#e4f0d8"/>
  <text x="128" y="196" font-size="22" fill="#1f4d1f" font-weight="600">VPC (aws_vpc.main)</text>

  <!-- Route table box -->
  <rect x="141" y="216" width="338" height="75" rx="10" fill="#d6efe4" stroke="#4a9b7f" stroke-width="1.5"/>
  <text x="310" y="248" font-size="19" fill="#1f5c47" text-anchor="middle" font-weight="700">Route table</text>
  <text x="310" y="272" font-size="15" fill="#1f5c47" text-anchor="middle">Public route 0.0.0.0/0</text>

  <!-- Arrow route table to subnet -->
  <line x1="310" y1="291" x2="310" y2="322" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="303,316 310,330 317,316" fill="#8a8a8a"/>

  <!-- Public subnet container -->
  <rect x="141" y="326" width="795" height="317" rx="20" fill="#cdeee0"/>
  <text x="171" y="365" font-size="20" fill="#1f5c47" font-weight="600">Public subnet</text>

  <!-- EC2 instance box -->
  <rect x="187" y="402" width="338" height="105" rx="10" fill="#f7ded9" stroke="#c46a52" stroke-width="1.5"/>
  <text x="356" y="443" font-size="20" fill="#8a3b26" text-anchor="middle" font-weight="700">EC2 instance (api)</text>
  <text x="356" y="470" font-size="15" fill="#8a3b26" text-anchor="middle">AMI: data.aws_ami.ubuntu</text>

  <!-- Arrow EC2 to Security group -->
  <line x1="525" y1="454" x2="562" y2="454" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="556,447 570,454 556,461" fill="#8a8a8a"/>

  <!-- Security group box -->
  <rect x="572" y="402" width="324" height="160" rx="10" fill="#f4e2be" stroke="#c99a3f" stroke-width="1.5"/>
  <text x="734" y="443" font-size="20" fill="#7a5314" text-anchor="middle" font-weight="700">Security group (api)</text>
  <text x="734" y="470" font-size="15" fill="#7a5314" text-anchor="middle">Ingress: HTTP 80</text>
  <text x="734" y="495" font-size="15" fill="#7a5314" text-anchor="middle">Egress: all traffic</text>

  <!-- Arrow EC2 to IAM instance profile -->
  <line x1="356" y1="507" x2="356" y2="537" stroke="#8a8a8a" stroke-width="2"/>
  <polygon points="349,531 356,545 363,531" fill="#8a8a8a"/>

  <!-- IAM instance profile box -->
  <rect x="187" y="548" width="338" height="80" rx="10" fill="#e4e1f5" stroke="#7466b0" stroke-width="1.5"/>
  <text x="356" y="582" font-size="20" fill="#3f3577" text-anchor="middle" font-weight="700">IAM instance profile</text>
  <text x="356" y="607" font-size="15" fill="#3f3577" text-anchor="middle">SSM role (ec2_ssm)</text>
</svg>
